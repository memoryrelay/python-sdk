[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memoryrelay"
version = "0.4.0"
description = "Official Python SDK for MemoryRelay - ICM workspaces and persistent memory for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "MemoryRelay Team", email = "hello@memoryrelay.ai" }
]
keywords = ["ai", "memory", "api", "sdk", "llm", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.1.0",
]
llamaindex = [
    "llama-index-core>=0.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "respx>=0.20.0",
]

[project.urls]
Homepage = "https://memoryrelay.ai"
Documentation = "https://docs.memoryrelay.ai/"
Repository = "https://github.com/memoryrelay/python-sdk"
Issues = "https://github.com/memoryrelay/python-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["memoryrelay"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
